<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./calculation.css">
    <title>Document</title>
</head>

<body class="container text-center mt-5">
    <div class="fundo p-4 rounded mx-auto shadow">
        <div class="calculadora">
            <h1 class="mb-3">Calculadora</h1>
            <p id="resultado" class="form-control text-end bg-light text-dark p-2"></p>
            <table class="table table-dark table-bordered">
                <tr>
                    <td><button class="botao btn btn-danger" onclick="clean()">C</button></td>
                    <td><button class="botao btn btn-secondary" onclick="back()">DEL</button></td>
                    <td><button class="botao btn btn-warning" onclick="insert('/')">/</button></td>
                    <td><button class="botao btn btn-warning" onclick="insert('*')">X</button></td>
                </tr>
                <tr>
                    <td><button class="botao btn btn-light" onclick="insert('7')">7</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('8')">8</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('9')">9</button></td>
                    <td><button class="botao btn btn-warning" onclick="insert('-')">-</button></td>
                </tr>
                <tr>
                    <td><button class="botao btn btn-light" onclick="insert('4')">4</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('5')">5</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('6')">6</button></td>
                    <td><button class="botao btn btn-warning" onclick="insert('+')">+</button></td>
                </tr>
                <tr>
                    <td><button class="botao btn btn-light" onclick="insert('1')">1</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('2')">2</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('3')">3</button></td>
                    <td rowspan="2"><button class="botao btn btn-success w-100" style="height: 106px;" onclick="calcular()">=</button></td>
                </tr>
                <tr>
                    <td colspan="2"><button class="botao btn btn-light w-100" onclick="insert('0')">0</button></td>
                    <td><button class="botao btn btn-light" onclick="insert('.')">.</button></td>
                </tr>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./calculation.js"></script>
</body>

</html>
